name: Check and Deploy Aily Coder Editor to NPM

on:
  push:
    branches:
      - deploy

permissions:
  contents: read

jobs:
  build-package:
    name: Build package
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      package_name: ${{ steps.package-metadata.outputs.package_name }}
      package_version: ${{ steps.package-metadata.outputs.package_version }}
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:subapp

      - name: Read package metadata
        id: package-metadata
        run: |
          node -e "const fs=require('node:fs'); const p=require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'package_name=' + p.name + '\npackage_version=' + p.version + '\n')"

      - name: Check npm package
        run: npm pack --dry-run --ignore-scripts .

      - name: Create npm package
        run: |
          package_dir="$RUNNER_TEMP/aily-coder-editor-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts . --pack-destination "$package_dir"
          shopt -s nullglob
          package_tarballs=("$package_dir"/*.tgz)
          if [ "${#package_tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package, found ${#package_tarballs[@]}."
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aily-coder-editor-package
          path: ${{ runner.temp }}/aily-coder-editor-package-${{ github.run_id }}-${{ github.run_attempt }}/*.tgz
          if-no-files-found: error

  publish-default:
    name: Publish default registry
    needs: build-package
    runs-on: [self-hosted, ailydeMac-mini, macOS, ARM64]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.REGISTRY_URL }}

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: aily-coder-editor-package
          path: ${{ runner.temp }}/aily-coder-editor-package-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish package to default registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.build-package.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build-package.outputs.package_version }}
        run: |
          set -euo pipefail

          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          package_dir="$RUNNER_TEMP/aily-coder-editor-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          shopt -s nullglob
          package_tarballs=("$package_dir"/*.tgz)
          if [ "${#package_tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package, found ${#package_tarballs[@]}."
            exit 1
          fi
          package_tarball="${package_tarballs[0]}"

          echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version &> /dev/null; then
            echo "Version $PACKAGE_VERSION exists, unpublishing..."
            retry_with_backoff 3 3 npm unpublish "$PACKAGE_NAME@$PACKAGE_VERSION" --force
            sleep 5
          fi

          retry_with_backoff 5 5 npm publish "$package_tarball"
          retry_with_backoff 5 5 npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version

      - name: Notify cache bump
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL or NOTIFY_TOKEN not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response.txt || true
          fi

  publish-registry2:
    name: Publish registry 2
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: aily-coder-editor-package
          path: ${{ runner.temp }}/aily-coder-editor-package-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish package to registry 2
        env:
          REGISTRY_2: ${{ secrets.REGISTRY_URL_2 }}
          TOKEN_2: ${{ secrets.NPM_TOKEN_2 }}
          PACKAGE_NAME: ${{ needs.build-package.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build-package.outputs.package_version }}
        run: |
          set -euo pipefail

          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          if [ -z "$REGISTRY_2" ] || [ -z "$TOKEN_2" ]; then
            echo "Registry 2 secrets not set, skipping."
            exit 0
          fi

          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2" | sed 's/^https\?:\/\///')
          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2_NO_PROTO" | sed 's/\/$//')

          echo "registry=$REGISTRY_2" > .npmrc
          echo "//$REGISTRY_2_NO_PROTO/:_authToken=$TOKEN_2" >> .npmrc
          trap 'rm -f .npmrc' EXIT

          package_dir="$RUNNER_TEMP/aily-coder-editor-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          shopt -s nullglob
          package_tarballs=("$package_dir"/*.tgz)
          if [ "${#package_tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package, found ${#package_tarballs[@]}."
            exit 1
          fi
          package_tarball="${package_tarballs[0]}"

          echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version &> /dev/null; then
            echo "Version $PACKAGE_VERSION exists on $REGISTRY_2, unpublishing..."
            retry_with_backoff 3 3 npm unpublish "$PACKAGE_NAME@$PACKAGE_VERSION" --force
            sleep 5
          fi

          retry_with_backoff 5 5 npm publish "$package_tarball"
          retry_with_backoff 5 5 npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version

      - name: Notify cache bump for registry 2
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL_2 }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN_2 }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL_2 or NOTIFY_TOKEN_2 not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response_2.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification (Registry 2) request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification (Registry 2) sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification (Registry 2) failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response_2.txt || true
          fi

  publish-subapp-index:
    name: Publish subapp index
    needs: [publish-default, publish-registry2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate subapp index
        run: node scripts/generate-subapp-index.mjs

      - name: Merge and upload subapp index
        env:
          SUBAPP_INDEX_URL: ${{ secrets.SUBAPP_INDEX_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          if [ -z "$SUBAPP_INDEX_URL" ] || [ -z "$R2_ACCOUNT_ID" ] || \
            [ -z "$R2_BUCKET_NAME" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || \
            [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "SUBAPP_INDEX_URL or required R2 secrets are not set."
            exit 1
          fi

          remote_index="$RUNNER_TEMP/subapp-index.remote.json"
          http_status=$(curl --silent --show-error --location \
            --output "$remote_index" \
            --write-out "%{http_code}" \
            "$SUBAPP_INDEX_URL")

          if [ "$http_status" = "404" ]; then
            echo "No remote subapp-index.json found; uploading the generated index."
          elif [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            REMOTE_INDEX="$remote_index" node --input-type=module -e '
              import { readFile, writeFile } from "node:fs/promises"

              const remote = JSON.parse(await readFile(process.env.REMOTE_INDEX, "utf8"))
              const localPath = "dist/subapp-index.json"
              const local = JSON.parse(await readFile(localPath, "utf8"))
              const rootPackage = JSON.parse(await readFile("package.json", "utf8"))
              const isObject = value => value && typeof value === "object" && !Array.isArray(value)

              if (!isObject(remote) || !isObject(local)) {
                throw new Error("Remote and local subapp indexes must be JSON objects")
              }

              const merged = { ...remote, ...local }
              if (rootPackage.hide === true) {
                const subapp = isObject(rootPackage.ailySubapp) ? rootPackage.ailySubapp : {}
                const id = typeof subapp.id === "string" && subapp.id.trim() ? subapp.id.trim() : "aily-coder-editor"
                delete merged[id]
              }

              await writeFile(localPath, `${JSON.stringify(merged, null, 2)}\n`)
            '
            echo "Merged local subapp entries into the remote index."
          else
            echo "Failed to download subapp-index.json (HTTP $http_status)."
            exit 1
          fi

          aws s3 cp dist/subapp-index.json \
            "s3://$R2_BUCKET_NAME/subapp-index.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --only-show-errors
